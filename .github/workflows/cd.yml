name: CD Metradingplat MarketData Service

on:
  workflow_run:
    workflows: ["CI Metradingplat MarketData Service"]
    types:
      - completed

jobs:
  deploy:
    runs-on: self-hosted
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Acquire exclusive deploy lock (avoid overwhelming the shared host)
        run: |
          LOCK_DIR="/tmp/metradingplat-deploy.lock"
          MAX_WAIT=2400
          MAX_LOCK_AGE=1800
          waited=0
          while ! mkdir "$LOCK_DIR" 2>/dev/null; do
            lock_age=$(( $(date +%s) - $(stat -c %Y "$LOCK_DIR" 2>/dev/null || date +%s) ))
            if [ "$lock_age" -gt "$MAX_LOCK_AGE" ]; then
              echo "Lock abandonado hace ${lock_age}s (el dueno probablemente murio) -- liberando y tomando control"
              rm -rf "$LOCK_DIR"
              continue
            fi
            if [ "$waited" -ge "$MAX_WAIT" ]; then
              echo "Timeout esperando el lock de deploy compartido"
              exit 1
            fi
            echo "Otro deploy de MeTradingPlat esta en curso, esperando... (${waited}s/${MAX_WAIT}s)"
            sleep 10
            waited=$((waited + 10))
          done
          echo "${{ github.repository }}" > "$LOCK_DIR/owner"
          echo "Lock de deploy adquirido"

      - name: Run TimescaleDB Container
        run: |
          # TimescaleDB, no postgres:15-alpine liso -- el diseno de retencion
          # de este servicio depende de hypertables + compresion (ver
          # internal/adapters/outgoing/repository/timescale/schema.sql), que
          # no existen en Postgres plano.
          if [ -z "$(docker ps -a -q -f name=postgres-marketdata)" ]; then
            echo "Creating and starting postgres-marketdata container..."
            # 4GiB, no 512m: el volumen tiene shared_buffers=1GB dentro de
            # PGDATA -- con 512m el postmaster ni arranca (falla la
            # asignacion de memoria compartida y entra en crash loop).
            docker run -d \
              --name "postgres-marketdata" \
              --network "metradingplat-network" \
              --restart "always" \
              --cpus "1.0" \
              --memory "4g" \
              --memory-swap "4g" \
              --shm-size "1g" \
              -e POSTGRES_DB="marketdata_db" \
              -e POSTGRES_USER="user_marketdata" \
              -e POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
              -v postgres_marketdata_data:/var/lib/postgresql/data \
              timescale/timescaledb:latest-pg15
          else
            echo "postgres-marketdata container exists, ensuring it is started..."
            docker start postgres-marketdata
          fi

      - name: Harden postgres locks/connections for full-universe rebuilds
        run: |
          # max_locks_per_transaction=256 (ya subido una vez de 64 tras un
          # incidente anterior, ver el comentario de connect() en
          # internal/infrastructure/configs/storage/timescale.go) volvio a
          # quedarse corto el 2026-08-31: reconstruir el universo COMPLETO
          # (D1+H1+M1 de los 13k simbolos a la vez, tras un reinicio) toca
          # muchos mas chunks del hypertable de una sola vez que el barrido
          # incremental de siempre, y goleo "out of shared memory" otra vez.
          # Ese ajuste se habia hecho a mano con ALTER SYSTEM directo en el
          # servidor -- nunca quedo en el repo, asi que un volumen nuevo lo
          # perdia en silencio (confirmado: postgresql.auto.conf lo tenia,
          # git no). Esto lo deja versionado -- se re-aplica en cada deploy
          # (ALTER SYSTEM es idempotente) y sobrevive a un volumen nuevo.
          #
          # max_connections=100 se quedo corto el mismo dia: confirmado en
          # vivo DOS veces durante la misma ventana de reconstruccion
          # (pg_stat_activity llego a 96/100) -- "sorry, too many clients
          # already" tumbando el refresh de fundamentales externos. 200 deja
          # margen real sobre el pico observado.
          #
          # Ambos requieren reinicio de postgres para tomar efecto
          # (PGC_POSTMASTER) -- se aplican juntos para no reiniciar dos veces.
          # Dos "-c" separados, no uno con ";" en el medio -- confirmado en
          # vivo el 2026-09-01: psql -c con mas de un statement los manda
          # como una sola query de multiples comandos, que Postgres corre
          # dentro de un bloque de transaccion implicito, y ALTER SYSTEM
          # explicitamente no puede correr adentro de una transaccion
          # ("ALTER SYSTEM cannot run inside a transaction block").
          docker exec postgres-marketdata psql -U user_marketdata -d marketdata_db -c "ALTER SYSTEM SET max_locks_per_transaction = 512;"
          docker exec postgres-marketdata psql -U user_marketdata -d marketdata_db -c "ALTER SYSTEM SET max_connections = 200;"
          docker restart postgres-marketdata
          for i in $(seq 1 15); do
            docker exec postgres-marketdata pg_isready -U user_marketdata >/dev/null 2>&1 && break
            sleep 2
          done

      - name: Harden postgres memory against OOM (memory.high)
        run: |
          # El cgroup de postgres se llena de page cache de las lecturas/
          # escrituras de velas -- el refresh de beta OOM-mato a postgres dos
          # veces el 2026-08-17 (recovery mode, SQLSTATE 57P03, sin escrituras
          # durante minutos). memory.high (cgroup v2) fuerza reclaim temprano
          # del cache, bajo el tope duro, en vez de esperar al OOM killer.
          #
          # Se subio a 6GiB/5GiB el 2026-09-02 y se REVIRTIO horas despues:
          # el host (11GiB, 4 nucleos, compartido con ~26 contenedores de
          # otros proyectos) no tenia margen real para darselo -- Postgres
          # crecio hasta ~5.6GiB de verdad (no es leak: la base pesa ~10-11GB
          # reales, mayormente TimescaleDB interno) y arrastro a TODO el host
          # a swap thrashing (load average 52 en 4 nucleos, 155MB libres,
          # Postgres sin loguear nada por 30min, comandos colgados en estado
          # D) -- mucho peor que el OOM aislado de un solo backend que el
          # tope de 4GiB/3.2GiB ya contenia. No subir esto de nuevo sin antes
          # confirmar que el host tiene RAM de sobra real, no solo "cache
          # reclamable" en el papel.
          #
          # NOTA: se re-aplica en cada deploy porque el scope de systemd se
          # recrea con cada `docker rm`/`docker run` de postgres.
          PG_ID=$(docker inspect -f '{{.Id}}' postgres-marketdata)
          if sudo -n true 2>/dev/null; then
            echo 3435973836 | sudo tee "/sys/fs/cgroup/system.slice/docker-${PG_ID}.scope/memory.high" >/dev/null
          else
            echo 3435973836 > "/sys/fs/cgroup/system.slice/docker-${PG_ID}.scope/memory.high"
          fi
          cat "/sys/fs/cgroup/system.slice/docker-${PG_ID}.scope/memory.high"

      - name: Apply Schema
        run: |
          docker exec -i postgres-marketdata psql -U user_marketdata -d marketdata_db < internal/adapters/outgoing/repository/timescale/schema.sql

      - name: Infrastructure Diagnosis & Cleanup
        run: |
          echo "--- DISK SPACE CHECK ---"
          df -h
          echo "--- PRUNING DANGLING IMAGES ---"
          docker image prune -f || true

      - name: Pull Application Image (with Retry Logic)
        run: |
          echo "Attempting to pull image with auto-retry for stability..."
          for i in 1 2 3 4 5; do
            timeout 600 docker pull virtud142/metradingplat_marketdata_service:latest && exit 0 || \
            (echo "Attempt $i failed, waiting $((i * 15))s..." && sleep $((i * 15)))
          done
          echo "All pull attempts failed. Docker daemon might need a manual restart."
          exit 1

      - name: Fix EDGAR cache volume ownership
        run: |
          # El volumen nombrado se crea root:root por defecto y el app corre
          # como UID 100/GID 101 (Alpine adduser -S) -- sin este chown el
          # cache de SEC EDGAR no es escribible y el refresh externo da
          # "permission denied" (confirmado en vivo 2026-08-18).
          docker volume create secedgar_cache 2>/dev/null || true
          docker run --rm -v secedgar_cache:/cache alpine chown -R 100:101 /cache

      - name: Delete Old Application Container
        run: |
          docker stop marketdata-service 2>/dev/null || true
          docker rm -f marketdata-service || true

      - name: Run Application Container
        run: |
          # Binario Go, sin JVM que calentar -- memoria muchisimo mas baja
          # que el servicio Java que reemplaza (ver historial de este repo).
          # 1g, no 512m: confirmado con dmesg (kernel OOM-killer) que el
          # proceso llego a ~518-522MB de RSS real y el cgroup lo mato dos
          # veces el 2026-08-19 -- una durante el barrido normal D1/H1/M1
          # (obligando a reiniciar el ciclo entero desde cero cada vez) y
          # otra bajo un lote grande de /historical/batch con gzip (el
          # payload de ~9MB por lote se arma completo en memoria antes de
          # comprimir). 1g deja margen real por encima de lo ya observado.
          # --stop-timeout 25: un docker stop (cada deploy, o manual) manda
          # SIGTERM y despues de este plazo mata a la fuerza con SIGKILL. El
          # shutdown handler (main.go) primero apaga el servidor HTTP (hasta
          # 10s de gracia propios) y RECIEN DESPUES cierra las ~40 conexiones
          # DxLink con FIN explicito para no dejar sesiones huerfanas -- con
          # el default de Docker (10s) el SIGKILL podia llegar antes de que
          # el cierre de DxLink ni empezara, dejando sesiones huerfanas en
          # CADA deploy pese a que el codigo ya intentaba evitarlo
          # (confirmado el 2026-09-02: storm de "sessions exceeded" en pleno
          # mercado horas despues de un deploy). 25s da margen real para las
          # dos etapas del shutdown, no solo la primera.
          docker run -d \
            --name "marketdata-service" \
            --network "metradingplat-network" \
            --restart "unless-stopped" \
            --stop-timeout 25 \
            --cpus "1.0" \
            --memory "1g" \
            --memory-swap "1g" \
            --label project="metradingplat" \
            --label service="marketdata-service" \
            -e DB_HOST="postgres-marketdata" \
            -e DB_PORT="5432" \
            -e DB_NAME="marketdata_db" \
            -e DB_USERNAME="user_marketdata" \
            -e DB_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
            -e DB_MAX_CONNS="25" \
            -e TT_CLIENT_ID="${{ secrets.TT_CLIENT_ID }}" \
            -e TT_CLIENT_SECRET="${{ secrets.TT_CLIENT_SECRET }}" \
            -e TT_REFRESH_TOKEN="${{ secrets.TT_REFRESH_TOKEN }}" \
            -e DXLINK_URL="${{ secrets.DXLINK_URL }}" \
            -e TEST_SYMBOLS="AAPL,MSFT,GOOGL,TSLA,AMZN" \
            -e TEST_MARKET="XNAS" \
            -e MAX_CANDLE_POOL_CONNECTIONS="40" \
            -e SWEEP_WORKERS="25" \
            -e EUREKA_HOST="directory" \
            -v secedgar_cache:/tmp/secedgar-cache \
            virtud142/metradingplat_marketdata_service:latest

      - name: Clean Old Images of This Service
        run: |
          echo "Cleaning old images for marketdata-service service..."
          CURRENT_IMAGE=$(docker inspect marketdata-service --format='{{.Image}}' 2>/dev/null || echo "")
          if [ -n "$CURRENT_IMAGE" ]; then
            docker images --filter "label=service=marketdata-service" --format "{{.ID}}" | while read img; do
              if [ "$img" != "${CURRENT_IMAGE:7:12}" ]; then
                echo "Removing old image: $img"
                docker rmi -f $img 2>/dev/null || true
              fi
            done
          fi
          docker images virtud142/metradingplat_marketdata_service --format "{{.ID}} {{.Tag}}" | grep -v "latest" | awk '{print $1}' | xargs -r docker rmi -f 2>/dev/null || true

      - name: Clean Stopped Containers of This Service
        run: |
          echo "Cleaning stopped containers for marketdata-service service..."
          docker ps -a --filter "label=service=marketdata-service" --filter "status=exited" -q | xargs -r docker rm 2>/dev/null || true

      - name: Final Status Check
        run: |
          sleep 10
          docker ps | grep marketdata-service
          echo "--- Container Logs (last 20 lines) ---"
          docker logs --tail 20 marketdata-service

      - name: Release exclusive deploy lock
        if: always()
        run: |
          LOCK_DIR="/tmp/metradingplat-deploy.lock"
          if [ -f "$LOCK_DIR/owner" ] && [ "$(cat "$LOCK_DIR/owner")" = "${{ github.repository }}" ]; then
            rm -rf "$LOCK_DIR"
          fi
