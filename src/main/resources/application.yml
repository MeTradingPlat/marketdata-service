spring:
  application:
    name: marketdata-service

  cloud:
    compatibility-verifier:
      enabled: false

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:marketdata_db}
    username: ${DB_USERNAME:user_marketdata}
    password: ${DB_PASSWORD:Kdh438#&*!}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  profiles:
    active: dev

logging:
  level:
    "[com.netflix.discovery.shared.resolver.aws.ConfigClusterResolver]": WARN
    "[com.metradingplat.marketdata]": INFO
    "[com.metradingplat.marketdata.infrastructure.output.external]": WARN
    "[com.metradingplat.marketdata.infrastructure.input]": INFO

server:
  port: 8082

# TastyTrade API Configuration
tastytrade:
  # OAuth 2.0 Credentials (load from .env file or environment variables)
  client-id: ${TT_CLIENT_ID}
  client-secret: ${TT_CLIENT_SECRET}
  refresh-token: ${TT_REFRESH_TOKEN}
  account-number: ${TASTYTRADE_ACCOUNT_NUMBER}

  # Production API URL
  api-base-url: https://api.tastytrade.com

  # DxLink WebSocket URL (Production by default)
  # Default: Production wss://tasty.dxfeed.com/realtime
  # For testing: wss://demo.dxfeed.com/dxlink-ws
  dxlink-url: ${DXLINK_URL:wss://tasty.dxfeed.com/realtime}

  # DxLink WebSocket Configuration
  dxlink:
    keepalive-interval: 30000
    connection-timeout: 10000
    accept-data-format: COMPACT

  # Token Refresh Configuration
  token-refresh:
    enabled: true
    fixed-rate-hours: 23

# Actuator for health checks
management:
  endpoints:
    web:
      base-path: /api/marketdata/api/actuator
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
