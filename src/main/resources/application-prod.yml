spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:29092}
    consumer:
      group-id: marketdata-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        "[spring.json.trusted.packages]": "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:directory}:8761/eureka/
  instance:
    prefer-ip-address: true

# Logging para producción
logging:
  level:
    "[com.metradingplat.marketdata]": INFO
    "[com.metradingplat.marketdata.infrastructure.output.external.tastytrade]": INFO
    "[org.springframework.kafka]": WARN
    "[org.springframework.web.socket]": WARN
    "[org.springframework.web.socket.client]": WARN

# TastyTrade Production Configuration
tastytrade:
  dxlink-url: ${DXLINK_URL:wss://tasty.dxfeed.com/realtime}
